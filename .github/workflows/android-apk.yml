name: Build Android debug APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install webapp dependencies
        # app/ imports the shared decode/map pipeline from ../webapp/src
        # (see CLAUDE.md); its node_modules (leaflet, etc.) must exist
        # too, since Node module resolution for those imports walks up
        # from webapp/src, not from app/.
        working-directory: webapp
        run: bun install --frozen-lockfile

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build web assets and sync Android
        working-directory: app
        run: bun run sync

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
